        <div class="movieModal" id="movieModal">
            <form id="movieForm">

                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <h3 class="m-0" id="changeTxt">Add Movie</h3>
                        <i role="button" class="closeMovieModal fa-solid fa-xmark fa-2x text-danger"></i>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="movieName">Movie Name</label>
                            <input type="text" class="form-control" id="movieName" required>
                        </div>


                        <div class="form-group">
                            <label for="movieImg">Movie Image</label>
                            <input  required type="text" class="form-control" id="movieImg" >
                        </div>

                        <div class="form-group">
                            <label for="movieDescription">Movie Description</label>
                            <textarea type="text" id="movieDescription" rows="4" class="form-control" required></textarea>

                        </div>


                        <div class="row">

                            <div class="col-4 mb-3 form-grpop">
                                <label for="movieRating" class="form-label">Movie Rating:</label>
                                <select class="form-select form-control" id="movieRating" required>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>


                            <div class="col-4 mb-3 form-grpop">
                                <label for="movieGener" class="orm-label">Movie Genre:</label>
                                <select class="form-select form-control" id="movieGener" required>
                                    <option value="">Select Genre</option>
                                    <option value="Action">Action</option>
                                    <option value="Comedy">Comedy</option>
                                    <option value="Drama">Drama</option>
                                    <option value="Horror">Horror</option>
                                    <option value="Romance">Romance</option>
                                    <option value="Crime/Action">Crime/Action</option>
                                    <option value="sci/fic">sci/fic</option>

                                    

                                </select>
                            </div>


                            <div class="col-4 mb-3 form-group">
                                <label for="movieReleaseDate" class="form-label">Release Date:</label>
                                <input type="date" class="form-control" id="movieReleaseDate" required />
                            </div>
                        </div>


                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button type="submit" class="btn btn-sm net-sec-btn" id="addMovieBtn">Add Movie</button>
                        <button type="button" class="btn btn-sm net-sec-btn d-none" id="updateMovieBtn">Update
                            Movie</button>

                        <button type="button" class="closeMovieModal btn btn-sm net-pri-btn">Close</button>

                    </div>
                </div>
            </form>
        </div>
        <div class="backDrop closeMovieModal" id="backDrop"></div>
    </div>
